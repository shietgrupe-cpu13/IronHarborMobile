name: Sync Android branch with VERA20K upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build an installable debug APK or signed release APK"
        type: choice
        options: [debug, release]
        default: debug
        required: true
      publish_release:
        description: "Publish the validated release APK as a public GitHub Release"
        type: boolean
        default: false
        required: true
  push:
    branches: [main, android-new]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "android/**"

permissions:
  contents: write

concurrency:
  group: sync-android-new-${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  sync-and-verify:
    name: Merge, test, and build android-new
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      source_sha: ${{ steps.upstream.outputs.source_sha }}
      upstream_sha: ${{ steps.upstream.outputs.upstream_sha }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      ANDROID_NDK_VERSION: "28.2.13676358"
      ANDROID_COMPILE_SDK: "36"
      ANDROID_BUILD_TOOLS: "36.1.0"
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
    steps:
      - name: Check out android-new
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: android-new
          fetch-depth: 0

      - name: Merge latest upstream main
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/YuriPlanet/vera20k.git
          git fetch upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "android-new already contains upstream $upstream_sha"
          else
            # On conflict, stop here: do not push a partial or forced update.
            git merge --no-ff --no-edit "$upstream_sha"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Merged upstream $upstream_sha"
          fi
          if [[ "$PUBLISH_RELEASE" == true && "$BUILD_TYPE" != release ]]; then
            echo "::error::Public release publishing requires build_type=release."
            exit 1
          fi
          validate=false
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/android-new)" ]] ||
             [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_ACTOR" != "github-actions[bot]" ]]; then
            validate=true
          fi
          echo "validate=$validate" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Temurin JDK 17
        if: steps.upstream.outputs.validate == 'true'
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle cache
        if: steps.upstream.outputs.validate == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # setup-gradle defaults non-default branches to read-only. android-new
          # is a long-lived build branch with its own GitHub cache scope.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/android-new' }}

      - name: Set up Android SDK
        if: steps.upstream.outputs.validate == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - name: Compile launcher and run JVM tests
        if: steps.upstream.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cat > "$RUNNER_TEMP/gradle-with-network-retry.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/gradle-attempt-$attempt.log"
            set +e
            ./android/gradlew "$@" --no-daemon --max-workers=2 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            # Retry recognized repository/transport failures only. Kotlin,
            # test, and other deterministic failures stop without another run.
            if ! grep -Eiq \
              'status code (429|5[0-9][0-9]) from server|HTTP/(1\.[01]|2) (429|5[0-9][0-9])|UnknownHostException|Temporary failure in name resolution|Connection reset|Connection refused|ConnectException|SocketTimeoutException|Read timed out|No route to host' \
              "$log"; then
              echo "Gradle failed without a recognized transient dependency/network error; not retrying."
              exit "$status"
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "Transient Gradle dependency/network failure; retrying in ${delay}s."
            sleep "$delay"
          done
          SCRIPT
          chmod +x "$RUNNER_TEMP/gradle-with-network-retry.sh"
          bash "$RUNNER_TEMP/gradle-with-network-retry.sh" -p android \
            :app:compileDebugKotlin :app:testDebugUnitTest

      - name: Set up Rust and ARM64 target
        if: steps.upstream.outputs.validate == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Android ARM64 Cargo artifacts
        if: steps.upstream.outputs.validate == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-new-arm64
          key: ${{ inputs.build_type == 'release' && 'shipping' || 'fast' }}

      - name: Install Linux audio headers for host-side Rust tests
        if: steps.upstream.outputs.validate == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libasound2-dev

      - name: Run focused Android storage, renderer, and Mental Omega regressions
        if: steps.upstream.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.cargo_run -- test -p vera20k-core --lib util::config::tests::android_config_folder_is_canonical_and_root_config_is_a_migration_fallback
          python -m tools.cargo_run -- test -p vera20k-core --lib util::config::tests::android_and_desktop_maps_use_the_shared_maps_directory
          python -m tools.cargo_run -- test -p vera20k --lib app::mods::tests::managed_mod_selection_does_not_treat_descendants_as_profiles
          python -m tools.cargo_run -- test -p vera20k-core --lib assets::asset_manager::install_inspection_tests::shared_ares_support_is_mod_only_and_a_mod_archive_takes_precedence
          python -m tools.cargo_run -- test -p vera20k-core --lib util::ini_roots::tests::explicit_mo_profile_resolves_its_roots_and_requires_the_complete_triplet
          python -m tools.cargo_run -- test -p vera20k-core --lib util::mod_definition::tests::mo_profile_defaults_to_mo_resources_and_manifest_overrides_only_named_slots
          python -m tools.cargo_run -- test -p vera20k-core --lib util::mod_definition::tests::mental_omega_manifest_identity_selects_mo_without_changing_unknown_mods
          python -m tools.cargo_run -- test -p vera20k-core --lib map::scenario_sources::tests::mental_omega_loose_catalog_discovers_and_loads_nested_maps
          python -m tools.cargo_run -- test -p vera20k-core --lib map::scenario_sources::tests::client_catalog_without_native_mode_match_keeps_native_modes_and_shared_maps
          python -m tools.cargo_run -- test -p vera20k-core --lib assets::client_install::tests::legacy_catalog_infers_modes_from_map_memberships_without_game_modes_registry
          python -m tools.cargo_run -- test -p vera20k-core --lib map::scenario_sources::tests::catalog_map_paths_reject_parent_and_absolute_components
          python -m tools.cargo_run -- test -p vera20k --lib app::persistence::options_profile::tests::launcher_renderer_write_is_narrow_persistent_and_rejects_desktop_only_apis
          python -m tools.cargo_run -- test -p vera20k --lib app::persistence::startup_backend::tests::android_renderer_fallback_tries_one_alternate_backend_without_a_cycle
          python -m tools.cargo_run -- test -p vera20k-core --lib assets::asset_manager::tests::mo_profile_resolves_and_loads_mo_roots_expansion_archive_and_mod_ares
          python -m tools.cargo_run -- test -p vera20k --lib app::input::touch::
          python -m tools.cargo_run -- test -p vera20k --lib app::input::camera::
          python -m tools.cargo_run -- test -p vera20k --lib app::input::dispatch::android_hud_group_tests::
          python -m tools.cargo_run -- test -p vera20k --lib render::skirmish_shell_chrome::

      - name: Install pinned Android NDK
        if: steps.upstream.outputs.validate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install cargo-ndk
        if: steps.upstream.outputs.validate == 'true'
        shell: bash
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Prepare persistent release signing key
        if: steps.upstream.outputs.validate == 'true' && inputs.build_type == 'release'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD \
                      ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository signing secret: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/iron-harbor-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          echo "ANDROID_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build ARM64 native library
        if: steps.upstream.outputs.validate == 'true'
        env:
          BUILD_TYPE: ${{ env.BUILD_TYPE }}
        shell: bash
        run: |
          set -euo pipefail
          profile=fast
          if [[ "$BUILD_TYPE" == release ]]; then
            profile=shipping
          fi
          cargo ndk -t arm64-v8a --platform 26 -o android/app/src/main/jniLibs build \
            --profile "$profile" -p vera20k-android --no-default-features

      - name: Assemble APK
        if: steps.upstream.outputs.validate == 'true'
        env:
          BUILD_TYPE: ${{ env.BUILD_TYPE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_TYPE" == release ]]; then
            bash "$RUNNER_TEMP/gradle-with-network-retry.sh" -p android :app:assembleRelease
          else
            mkdir -p android/.android
            keytool -genkeypair -keystore android/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            bash "$RUNNER_TEMP/gradle-with-network-retry.sh" -p android :app:assembleDebug
          fi

      - name: Apply persistent signing to the debug APK
        if: steps.upstream.outputs.validate == 'true' && inputs.build_type != 'release'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD \
                      ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository signing secret: $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/iron-harbor-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode \
            > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          signed="$RUNNER_TEMP/app-debug-persistent-signed.apk"
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --ks-pass env:ANDROID_RELEASE_STORE_PASSWORD \
            --key-pass env:ANDROID_RELEASE_KEY_PASSWORD \
            --out "$signed" "$apk"
          mv "$signed" "$apk"
          rm -f "$keystore"

      - name: Verify APK identity, persistent signature, and native alignment
        if: steps.upstream.outputs.validate == 'true'
        env:
          BUILD_TYPE: ${{ env.BUILD_TYPE }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          version_code="$(sed -n 's/^val veraVersionCode = \([0-9][0-9]*\)$/\1/p' android/app/build.gradle.kts)"
          build_label="$(sed -n 's/^val veraBuildLabel = "\([^"]*\)"$/\1/p' android/app/build.gradle.kts)"
          if [[ "$BUILD_TYPE" == release ]]; then
            expected_id=org.ironharbor.mobile
            apk=android/app/build/outputs/apk/release/app-release.apk
          else
            expected_id=org.ironharbor.mobile.debug
            apk=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          test -s "$apk"
          "$tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='$expected_id' versionCode='$version_code' versionName='$version_name'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
          signature="$RUNNER_TEMP/apk-signature.txt"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee "$signature"
          grep -F 'Signer #1 certificate SHA-256 digest: 7440ad6a732f410f570b55b8d7e0138b0a9ab318ce5553afc02e8e0527ce1711' "$signature"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          unzip -t "$apk"
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libvera20k_android.so'
          native="$RUNNER_TEMP/libvera20k_android.so"
          unzip -p "$apk" lib/arm64-v8a/libvera20k_android.so > "$native"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "$native" > "$RUNNER_TEMP/vera-elf-program-headers.txt"
          python3 - "$RUNNER_TEMP/vera-elf-program-headers.txt" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          alignments = [
              int(re.findall(r"0x[0-9a-fA-F]+", line)[-1], 16)
              for line in text.splitlines()
              if line.strip().startswith("LOAD") and re.findall(r"0x[0-9a-fA-F]+", line)
          ]
          if not alignments or min(alignments) < 16 * 1024:
              raise SystemExit(f"ARM64 LOAD alignment is below 16 KB: {alignments}")
          print(f"ARM64 ELF LOAD alignments: {alignments}")
          PY

          mkdir -p dist
          output="dist/IronHarborMobile-v${version_name}-${build_label}-${BUILD_TYPE}-arm64.apk"
          cp "$apk" "$output"
          sha256sum "$output" | tee dist/SHA256SUMS.txt
          echo "APK: $output"

      - name: Upload verified ARM64 APK artifact
        if: success() && steps.upstream.outputs.validate == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IronHarborMobile-android-new-${{ inputs.build_type || 'debug' }}-${{ steps.upstream.outputs.source_sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Push verified upstream merge
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin android-new
          remote="$(git rev-parse FETCH_HEAD)"
          if git merge-base --is-ancestor HEAD "$remote"; then
            echo "The validated candidate is already included in remote android-new ($remote)."
          elif git merge-base --is-ancestor "$remote" HEAD; then
            git push origin HEAD:refs/heads/android-new
          else
            echo "Remote android-new advanced on a separate line after this candidate was validated." >&2
            echo "Refusing to overwrite or merge unvalidated commits; rerun synchronization on the new head." >&2
            exit 1
          fi

      - name: Publish verified B61 release
        if: >-
          success() && steps.upstream.outputs.validate == 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' &&
          inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          version_code="$(sed -n 's/^val veraVersionCode = \([0-9][0-9]*\)$/\1/p' android/app/build.gradle.kts)"
          build_label="$(sed -n 's/^val veraBuildLabel = "\([^"]*\)"$/\1/p' android/app/build.gradle.kts)"
          if [[ "$build_label" != B61 || "$version_code" -le 267 ]]; then
            echo "::error::Refusing release: expected B61 and versionCode greater than B60's 267."
            exit 1
          fi
          tag="android-${build_label,,}"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Refusing to replace existing tag $tag."
            exit 1
          fi
          apk="dist/IronHarborMobile-v${version_name}-${build_label}-release-arm64.apk"
          test -s "$apk"
          sha="$(sha256sum "$apk" | cut -d ' ' -f1)"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          ## What's new since B60

          - Updates the Android build to VERA20K 0.4.3, including the upstream engine revision \`$UPSTREAM_SHA\`.
          - Fixes held-drag unit box selection so it begins at the original touch point and does not turn small hold jitter into a premature right-click.
          - Adds a launcher option to disable automatic startup diagnostic snapshots; engine logs, crash reports, and manual exports remain available.

          ## Compatibility

          - Package: \`org.ironharbor.mobile\`; version code: \`$version_code\` (B60 was 267).
          - ARM64 APK signed with the existing Iron Harbor release certificate for in-place updates.
          - You provide your own legally obtained game files; none are included.

          Fork source: \`$SOURCE_SHA\`

          Upstream source: \`$UPSTREAM_SHA\`

          SHA-256: \`$sha\`
          EOF
          printf 'SHA-256: %s\nAPK: %s\nFork source: %s\nUpstream source: %s\n' \
            "$sha" "$(basename "$apk")" "$SOURCE_SHA" "$UPSTREAM_SHA" > dist/changelog.txt
          gh release create "$tag" "$apk" dist/changelog.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Iron Harbor Mobile v${version_name} ${build_label}" \
            --notes-file "$notes" --target "$SOURCE_SHA" --latest
